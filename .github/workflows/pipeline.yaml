name: CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Hủy run cũ khi có commit mới trên cùng nhánh -> tiết kiệm CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: job chỉ đọc code, không cần quyền write
permissions:
  contents: read

jobs:
  quality-code:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10 # chặn job treo, tránh cháy quota

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
