services:
  api:
    build: .
    container_name: iu_club_api
    restart: unless-stopped
    ports:
      - "${PORT:-3456}:${PORT:-3456}"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/iu_club
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - iu_club_net

  mongo:
    image: mongo:7
    container_name: iu_club_mongo
    restart: unless-stopped
    command: ["--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - iu_club_net

volumes:
  mongo_data:

networks:
  iu_club_net:
    driver: bridge
